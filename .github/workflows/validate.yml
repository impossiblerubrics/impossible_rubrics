name: Validate benchmark

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python build_dataset.py --strict
      - run: python -m unittest discover -s tests -v
      - run: python analysis/census.py
      - name: Verify committed exports
        run: git diff --exit-code -- environments.json environments.jsonl controls.json controls.jsonl environments_all.json environments_all.jsonl
